# 节点订阅保留 smart；固定每 5 分钟重测。
# 不同网站可使用不同节点，界面显示的是近期最常用节点。
# 机场1, 机场2, 机场3 名称对应下面的机场链接名称
# 若需要统一前置中继，可在“节点订阅”组末尾添加 underlying-proxy=中继策略（iOS 5.22.0+ / Mac 6.9.0+）
节点订阅 = smart, include-other-group="机场1,机场2,机场3", hidden=false, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png

# 机场组用于导入并手动浏览节点；自动选路由节点订阅/地区 smart 组负责。
# 每个机场使用独立前缀(external-policy-name-prefix=)，避免多订阅节点重名；应用配置后需重新确认手选节点。
# 这里添加机场链接。这里的机场1、机场2、机场3 与上面 include-other-group 一一对应(名称可自定义)
机场1 = select, policy-path=机场链接地址, update-interval=86400, external-policy-name-prefix=机场1-, hidden=false, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png
机场2 = select, policy-path=机场链接地址, update-interval=86400, external-policy-name-prefix=机场2-, hidden=false, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png
机场3 = select, policy-path=机场链接地址, update-interval=86400, external-policy-name-prefix=机场3-, hidden=false, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png

[Rule]
# 基础直连：优先处理局域网、IPv6 ULA 和系统请求，避免扫描后续大型规则集
RULE-SET,LAN,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
RULE-SET,SYSTEM,DIRECT // 系统请求
# 国内媒体PCDN拦截
RULE-SET,https://cdn.jsdelivr.net/gh/dqzboy/Loon_Surge_Rule@main/Rule/Pcdn/Pcdn.list,REJECT-DROP,extended-matching // PCDN拦截
# 广告拦截规则
#RULE-SET,https://cdn.jsdelivr.net/gh/TG-Twilight/AWAvenue-Ads-Rule@main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT-DROP,extended-matching // AWAvenue 广告拦截
# 人工智能服务
RULE-SET,https://cdn.jsdelivr.net/gh/dqzboy/Loon_Surge_Rule@main/Rule/AI/Ai.list,人工智能,extended-matching //人工智能服务
# YouTube 专用规则先于 Google：避免 googlevideo.com / youtubei.googleapis.com 被 Google 的宽泛规则抢先匹配
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/YouTube/YouTube.list,YouTube,extended-matching // YouTube
# 国外社交媒体服务
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Google/Google.list,Google,extended-matching // Google
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/GitHub/GitHub.list,GitHub,extended-matching // GitHub
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Telegram/Telegram.list,Telegram,extended-matching // Telegram
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Twitter/Twitter.list,Twitter,extended-matching // Twitter
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Facebook/Facebook.list,Facebook,extended-matching // Facebook
# 海外流媒体服务
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Netflix/Netflix.list,Netflix,extended-matching // 奈飞
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Disney/Disney.list,Disney+,extended-matching // Disney+
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Spotify/Spotify.list,Spotify,extended-matching // Spotify
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/TikTok/TikTok.list,TikTok,extended-matching // TikTok
# 其他国外服务
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/PayPal/PayPal.list,Paypal,extended-matching // PayPal
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Reddit/Reddit.list,Reddit,extended-matching // Reddit
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Discord/Discord.list,Discord,extended-matching // Discord
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Cloudflare/Cloudflare.list,Cloudflare,extended-matching // Cloudflare
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Microsoft/Microsoft.list,Microsoft,extended-matching // Microsoft
# 系统和企业服务
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Docker/Docker.list,Docker,extended-matching // Docker
# 国内服务（按需启用；是否触发 DNS 取决于规则集是否包含未设置 no-resolve 的 IP 规则）
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/BiliBili/BiliBili.list,哔哩哔哩,extended-matching // 哔哩哔哩
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Weibo/Weibo.list,新浪微博,extended-matching // 新浪微博
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Alibaba/Alibaba.list,阿里巴巴,extended-matching // 阿里巴巴
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Tencent/Tencent.list,腾讯服务,extended-matching // 腾讯服务
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Baidu/Baidu.list,百度服务,extended-matching // 百度服务
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/DouYin/DouYin.list,抖音服务,extended-matching // 抖音服务
# 综合媒体规则（谨慎启用）
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/GlobalMedia/GlobalMedia.list,国外媒体,extended-matching //国外媒体合集
#RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/ChinaMedia/ChinaMedia.list,国内媒体,extended-matching //国内媒体合集
# GEOIP 等于 CN 走直连；不使用 no-resolve，确保国内域名也能执行 GeoIP 判断
GEOIP,CN,DIRECT
# DNS 查询失败走Final规则
FINAL,节点选择,dns-failed

[MITM]
skip-server-cert-verify = false
h2 = true